<h2 mat-dialog-title>{{ "dialog.confirmTitle" | t }}</h2>
<mat-dialog-content>{{ msg }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ "common.cancel" | t }}</button>
  <button mat-flat-button [mat-dialog-close]="true">{{ "dialog.confirm" | t }}</button>
</mat-dialog-actions>
