spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/linguanotes_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:eddie}
    password: ${DB_PASSWORD:123456789}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
  servlet:
    session:
      timeout: 12h
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
app:
  public-url: ${APP_PUBLIC_URL:http://localhost:4200}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  file-storage-dir: ${FILE_STORAGE_DIR:./data/files}
  mail:
    from: ${MAIL_FROM:noreply@linguanotes.local}
  ai:
    api-key: ${AI_API_KEY:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
